# macOS applications are isolated from the base profile. mise refuses to take
# over casks already owned by Homebrew, so ./install skips this profile on an
# existing Homebrew workstation and reports the required manual migration.

[settings]
system_packages.managers = ["brew-cask", "mas"]

[bootstrap.packages]
"brew-cask:font-hack" = "latest"
"brew-cask:font-fira-code" = "latest"
"brew-cask:font-jetbrains-mono" = "latest"
"brew-cask:ghostty" = "latest"
"brew-cask:sublime-text" = "latest"
"brew-cask:visual-studio-code" = "latest"
"brew-cask:vivaldi" = "latest"
"brew-cask:firefox" = "latest"
"brew-cask:brave-browser" = "latest"
"brew-cask:1password" = "latest"
"brew-cask:1password-cli" = "latest"
"brew-cask:vlc" = "latest"
"brew-cask:iina" = "latest"
"brew-cask:hammerspoon" = "latest"
"brew-cask:hyperkey" = "latest"
"brew-cask:rectangle" = "latest"
"brew-cask:discord" = "latest"
"brew-cask:spotify" = "latest"
"brew-cask:itsycal" = "latest"
"brew-cask:orbstack" = "latest"
"brew-cask:google-drive" = "latest"
