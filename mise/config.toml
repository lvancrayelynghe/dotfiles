# Languages
node = "lts"
# AI
antigravity-cli = "latest"
claude = "latest"
codex = "latest"
llmfit = "latest"
# Others
bat = "latest"
cloudflared = "latest"
delta = "latest"
duf = "latest"
dust = "latest"
eza = "latest"
fd = "latest"
fzf = "latest"
gh = "latest"
jq = "latest"
lnav = "latest"
rclone = "latest"
ripgrep = "latest"
sd = "latest"
shellcheck = "latest"
tealdeer = "latest"
television = "latest"
xh = "latest"
yazi = "latest"
zoxide = "latest"

# CLIs with no mise registry shorthand: pinned to their upstream GitHub releases
# (github: backend, not the deprecated ubi:) or a prebuilt-binary aqua package.
"github:chaqchase/lla" = "latest"
"github:Lymphatus/caesium-clt" = "latest"
"github:ouch-org/ouch" = "latest"
"github:svent/sift" = "latest"
"github:tokuhirom/dcv" = "latest"

# Most command-line tools deliberately live above: mise installs them through
# portable, version-aware backends. Native packages belong in the OS profiles.

# This file — and ONLY this file — is symlinked into the global mise environment
# (~/.config/mise/conf.d/public.toml, the link declared in the repo-root
# mise.toml). That is why it holds nothing but [tools]: a globally loaded config
# must be correct from any directory, and [tools] carry no paths. Anything with a
# repository-relative path or bootstrap semantics ([dotfiles], [bootstrap.*],
# [tasks.*]) would resolve against config_root = ~/.config/mise when read through
# that symlink, so it lives in repo-only files (mise.toml, config.<os>.toml)
# instead — see the [dotfiles] table in the repo-root mise.toml.
