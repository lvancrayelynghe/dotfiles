# Apple-only keywords. /usr/bin/ssh on macOS knows them; upstream OpenSSH does
# not and aborts on an unknown keyword, which is why this file is mapped by the
# `macos` dotter package alone. The IgnoreUnknown in ~/.ssh/config covers them
# regardless, so a stray copy on a Linux box cannot break ssh either.
#
# Numbered 95, after 90-defaults.conf: both hold a Host * block, they set
# different keywords, so nothing competes between the two.

Host *
    UseKeychain yes     # reuse the passphrases stored in the login keychain
    WarnWeakCrypto no
