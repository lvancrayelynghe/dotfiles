# Defaults for every host. Numbered 90 so it is read AFTER every host file:
# ssh keeps the first value it obtains, so anything set here is still
# overridable by a Host block in a lower-numbered file. Adding a host to a
# file numbered above 90 would silently lose to these defaults.
#
# SetEnv and AddKeysToAgent are too recent for the oldest servers; the single
# IgnoreUnknown in ~/.ssh/config keeps them from aborting the parse there.

Host *
    ServerAliveInterval 60
    AddKeysToAgent yes
    ForwardAgent yes # Applies to every host. One host can opt out on its own with `ForwardAgent no` in its file.
    SendEnv LANG LC_*
    SetEnv TERM=xterm-256color
