# 1Password SSH agent: keys live in the vault, never on disk, and each use is
# approved from the app. Mapped by the `macos` dotter package because the socket
# path is macOS-specific -- the keyword itself is plain OpenSSH (>= 7.3).
#
# The container id is not a secret: 2BUA8C4S2C is 1Password's team id, the same
# for every installation.
#
# Numbered 92, between the defaults and the Apple-only keywords: all three are
# Host * blocks setting different keywords, so none competes with another. A
# host that needs a real key file can still override this from a lower-numbered
# file with `IdentityAgent none` plus its own IdentityFile, since ssh keeps the
# first value it obtains.

Host *
    IdentityAgent "~/Library/Group Containers/2BUA8C4S2C.com.1password/t/agent.sock"
