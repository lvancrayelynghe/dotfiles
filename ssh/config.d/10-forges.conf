# Public git hosting. Versioned: nothing here is private.
#
# `User git` is the point of these blocks -- it makes `ssh github.com` and a
# remote written as github.com:owner/repo work without spelling out git@.

Host bitbucket.org
    HostName bitbucket.org
    User git

Host github.com
    HostName github.com
    User git

Host gitlab.com
    HostName gitlab.com
    User git
