# dotter configuration — https://github.com/SuperCuber/dotter
# Every machine picks its packages in .dotter/local.toml (not committed,
# see .dotter/local.toml.example). Deploy with ./install (wrapper) or
# `dotter deploy --force`. All entries are symbolic links: the files in
# $HOME point into this repository and are edited in place.

[common.files]
"bash/profile" = { target = "~/.profile", type = "symbolic" }
"bash/bashrc" = { target = "~/.bashrc", type = "symbolic" }
"bash/inputrc" = { target = "~/.inputrc", type = "symbolic" }
"zsh/zshenv" = { target = "~/.zshenv", type = "symbolic" }
"zsh/zprofile" = { target = "~/.zprofile", type = "symbolic" }
"zsh/zshrc" = { target = "~/.zshrc", type = "symbolic" }
"others/gitconfig" = { target = "~/.gitconfig", type = "symbolic" }
"others/gitignore-global" = { target = "~/.gitignore-global", type = "symbolic" }
"others/gitattributes" = { target = "~/.gitattributes", type = "symbolic" }
"others/git-templates" = { target = "~/.git-templates", type = "symbolic" }
"vim/vim" = { target = "~/.vim", type = "symbolic" }
"vim/vimrc" = { target = "~/.vimrc", type = "symbolic" }
"others/tmux.conf" = { target = "~/.tmux.conf", type = "symbolic" }
"others/nanorc" = { target = "~/.nanorc", type = "symbolic" }
"others/wgetrc" = { target = "~/.wgetrc", type = "symbolic" }
"others/cvsignore" = { target = "~/.cvsignore", type = "symbolic" }
"others/dircolors" = { target = "~/.dircolors", type = "symbolic" }
"others/gemrc" = { target = "~/.gemrc", type = "symbolic" }
"others/lesskey" = { target = "~/.lesskey", type = "symbolic" }
"others/my.cnf" = { target = "~/.my.cnf", type = "symbolic" }
"others/sift.conf" = { target = "~/.sift.conf", type = "symbolic" }
# ssh: the skeleton declares no host, they all live in ~/.ssh/config.d/. Only
# the public files are mapped; 50-internes, 60-clients and 80-archives are
# created by hand and stay off this repo. An Include that matches nothing is a
# silent no-op, so their absence on a server breaks nothing.
"ssh/config" = { target = "~/.ssh/config", type = "symbolic" }
"ssh/config.d/10-forges.conf" = { target = "~/.ssh/config.d/10-forges.conf", type = "symbolic" }
"ssh/config.d/90-defaults.conf" = { target = "~/.ssh/config.d/90-defaults.conf", type = "symbolic" }
"ranger/rc.conf" = { target = "~/.config/ranger/rc.conf", type = "symbolic" }
"ranger/commands.py" = { target = "~/.config/ranger/commands.py", type = "symbolic" }
"lla/config.toml" = { target = "~/.config/lla/config.toml", type = "symbolic" }
# Global toolchain versions. Symlinked on purpose: `mise use -g` then edits the
# versioned file, so a new machine gets the same node, claude and gemini.
"mise/config.toml" = { target = "~/.config/mise/config.toml", type = "symbolic" }
"claude/statusline-command.sh" = { target = "~/.claude/statusline-command.sh", type = "symbolic" }

[macos.files]
# recurse = false: single directory symlink, so Hammerspoon's pathwatcher
# resolves the repo directory and auto-reload keeps working on in-repo edits
"hammerspoon" = { target = "~/.hammerspoon", type = "symbolic", recurse = false }
"ghostty/config" = { target = "~/.config/ghostty/config", type = "symbolic" }
"rectangle/RectangleConfig.json" = { target = "~/Library/Application Support/Rectangle/RectangleConfig.json", type = "symbolic" }
"vscode/settings.json" = { target = "~/Library/Application Support/Code/User/settings.json", type = "symbolic" }
"vscode/keybindings.json" = { target = "~/Library/Application Support/Code/User/keybindings.json", type = "symbolic" }
"vscode/snippets" = { target = "~/Library/Application Support/Code/User/snippets", type = "symbolic" }
"others/gitconfig-macos" = { target = "~/.gitconfig-macos", type = "symbolic" }
# UseKeychain and WarnWeakCrypto only exist in Apple's ssh: upstream OpenSSH
# aborts on them, hence the macos package. Kept harmless anyway by the single
# IgnoreUnknown in ssh/config, verified against OpenSSH 9.2 on Debian 12.
"ssh/config.d/95-macos.conf" = { target = "~/.ssh/config.d/95-macos.conf", type = "symbolic" }

# Linux with a desktop (not servers): enable in local.toml alongside common
[linux-desktop.files]
"vscode/settings.json" = { target = "~/.config/Code/User/settings.json", type = "symbolic" }
"vscode/keybindings.json" = { target = "~/.config/Code/User/keybindings.json", type = "symbolic" }
"vscode/snippets" = { target = "~/.config/Code/User/snippets", type = "symbolic" }
